[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    # LanceDB benennt table_names() gerade in list_tables() um, deren
    # Rueckgabeform sich zwischen Versionen unterscheidet. table_names()
    # funktioniert in allen unterstuetzten Versionen und bleibt deshalb.
    "ignore:table_names\\(\\) is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # Funktionsaufruf als Default-Argument — bei Streamlit üblich
]
